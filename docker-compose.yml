version: '3.8'

services:
  app:
    image: project-management
    container_name: project-management
    ports:
      - "8688:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/project_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - db
    networks:
      - olh_news_network
    restart: unless-stopped

  db:
    image: mysql:latest
    container_name: mysql-db
    ports:
      - "3309:3306"
    environment:
      - MYSQL_DATABASE=project_management
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - olh_news_network
    restart: unless-stopped

networks:
  olh_news_network:
    name: olh_news_network
    external: true

volumes:
  mysql-data: